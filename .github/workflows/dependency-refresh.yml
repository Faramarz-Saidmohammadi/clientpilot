name: Dependency Refresh

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh dependency metadata
        run: |
          npm install --package-lock-only
          npm audit fix --package-lock-only

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Faramarz Said Mohammadi"
          git config user.email "136171600+Faramarz-Saidmohammadi@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: refresh dependency lockfile"
          git push origin HEAD:${{ github.head_ref }}
